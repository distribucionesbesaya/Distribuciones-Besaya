<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tocinetas - Distribuciones Besaya</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        nav {
            background-color: #222;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        header {
            text-align: center;
            padding: 45px 20px 25px;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 18px;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        main > section > h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .producto {
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            text-align: center;
            padding-bottom: 20px;
            transition: transform 0.3s;
        }

        .producto:hover {
            transform: translateY(-5px);
        }

        .producto img {
            width: 100%;
            height: 280px;
            object-fit: contain;
            background-color: #fafafa;
        }

        .producto h3 {
            font-size: 21px;
            margin: 18px 10px 8px;
        }

        .producto p {
            color: #666;
            margin: 0 15px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            background-color: #222;
            color: white;
        }

        @media (max-width: 800px) {

            .catalogo {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 550px) {

            .catalogo {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <nav>

        <a href="index.html">Inicio</a>

    </nav>


    <header>

        <h1>Tocinetas</h1>

        <p>
            Conoce nuestra tocineta.
        </p>

    </header>


    <main>

        <section>

            <h2>Catálogo de tocinetas</h2>

            <div class="catalogo">


                <article class="producto">

                    <img src="tocineta-ahumada-900g.jpeg"
                         alt="Tocineta ahumada 900 gramos">

                    <h3>Tocineta Ahumada</h3>

                    <p>
                        Tocineta ahumada en presentación de 900 gramos.
                    </p>

                </article>


            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Distribuciones Besaya
        </p>

    </footer>


</body>

</html>
